<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>algoHub | Pattern Tracks</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: -0.01em;
      background-color: #fafafa;
    }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', monospace; }

    .theme-orb { 
      width: 20px; 
      height: 20px; 
      border-radius: 50%; 
      position: relative; 
      transition: all .3s; 
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .theme-orb.sun { 
      background: radial-gradient(circle at 35% 30%, #ffe9b0, #f5a623 70%); 
      box-shadow: 0 0 12px 2px rgba(245,166,35,0.7); 
    }
    
    .theme-orb.moon { 
      background: radial-gradient(circle at 65% 35%, #d8def8, #e4e4e7 75%); 
      box-shadow: 0 0 10px 1px rgba(228,228,231,0.4); 
    }
    
    .theme-orb.moon::before { 
      content:''; 
      position:absolute; 
      top:3px; 
      left:2px; 
      width:7px; 
      height:7px; 
      border-radius:50%; 
      background:#141414; 
      opacity:.5; 
    }
    
    .theme-orb.moon::after { 
      content:''; 
      position:absolute; 
      top:10px; 
      left:10px; 
      width:4px; 
      height:4px; 
      border-radius:50%; 
      background:#141414; 
      opacity:.4; 
    }

    html.dark body { background-color: #0a0a0a; }
  </style>
</head>
<body class="text-zinc-900 dark:text-zinc-100 min-h-screen antialiased selection:bg-zinc-500/20">

  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/75 dark:bg-[#0a0a0a]/80 border-b border-zinc-200 dark:border-zinc-800/80 px-6 py-3.5 flex justify-between items-center w-full transition-all">
    <a href="./dashboard" class="flex items-center gap-3 hover:opacity-80 transition cursor-pointer group">
      <img src="./favicon.png" alt="algoHub" class="w-8 h-8 rounded-lg shadow-sm border border-zinc-200/50 dark:border-zinc-800/80 group-hover:scale-105 transition-transform duration-200">
      <span class="text-xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">algoHub</span>
    </a>

    <div class="flex items-center gap-4">
      <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-400 hover:text-zinc-900 dark:hover:text-white bg-zinc-100/60 dark:bg-[#161616] hover:bg-zinc-200/60 dark:hover:bg-zinc-800 border border-zinc-200/80 dark:border-zinc-800 transition-all duration-200 cursor-pointer shadow-sm" title="Toggle theme"><span id="theme-orb" class="theme-orb sun"></span></button>

      <div class="flex items-center gap-3 pl-4 border-l border-zinc-200 dark:border-zinc-800">
        <img id="user-avatar" class="w-8 h-8 rounded-full border border-zinc-200 dark:border-zinc-800 bg-zinc-100 dark:bg-zinc-800 object-cover" src="" alt="Profile">
        <button id="btn-logout" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-zinc-100 dark:bg-[#161616] border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 hover:text-rose-600 dark:hover:text-rose-400 hover:border-rose-500/30 transition-all duration-200 hover:-translate-y-0.5 cursor-pointer shadow-sm">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="mb-10">
      <a href="./dashboard" class="text-xs font-medium text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white transition flex items-center gap-1.5 mb-2 w-max">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        Back to Dashboard
      </a>
      <h1 id="course-title" class="text-3xl sm:text-4xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">Curriculum Tracks</h1>
      <p class="text-zinc-500 dark:text-zinc-400 text-sm mt-1">Select a conceptual pattern to begin your targeted practice session.</p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="tracks-grid"></div>
  </main>

  <script type="module">
    import { SUPABASE_CONFIG } from './config.js';
    const supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);

    const themeToggleBtn = document.getElementById('theme-toggle');
    const orb = document.getElementById('theme-orb');
    function applyTheme(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        orb.classList.toggle('sun', !isDark);
        orb.classList.toggle('moon', isDark);
    }
    const storedTheme = localStorage.getItem('color-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(storedTheme === 'dark' || (!storedTheme && prefersDark));

    themeToggleBtn.addEventListener('click', function() {
        const goingDark = !document.documentElement.classList.contains('dark');
        applyTheme(goingDark);
        localStorage.setItem('color-theme', goingDark ? 'dark' : 'light');
        });

    const TRACK_METADATA = {
        "Array": {
            color: "blue",
            desc: "Contiguous memory and two-pointer basics.",
            svg: `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line>`
        },
        "String": {
            color: "indigo",
            desc: "Sliding windows and character hashing.",
            svg: `<polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line>`
        },
        "Linked List": {
            color: "purple",
            desc: "Pointer manipulation and cycle detection.",
            svg: `<circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="12" r="3"></circle><line x1="9" y1="12" x2="15" y2="12"></line><polyline points="13 9 16 12 13 15"></polyline>`
        },
        "Binary": {
            color: "rose",
            desc: "Bitwise operations and binary logic.",
            svg: `<rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line>`
        },
        "Matrix": {
            color: "cyan",
            desc: "2D traversals and spatial transformations.",
            svg: `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line>`
        },
        "Interval": {
            color: "amber",
            desc: "Sorting boundaries and merging sequences.",
            svg: `<line x1="4" y1="6" x2="14" y2="6"></line><line x1="10" y1="12" x2="20" y2="12"></line><line x1="6" y1="18" x2="16" y2="18"></line><circle cx="4" cy="6" r="1"></circle><circle cx="14" cy="6" r="1"></circle><circle cx="10" cy="12" r="1"></circle><circle cx="20" cy="12" r="1"></circle><circle cx="6" cy="18" r="1"></circle><circle cx="16" cy="18" r="1"></circle>`
        },
        "Tree": {
            color: "emerald",
            desc: "DFS, BFS, and hierarchical traversals.",
            svg: `<circle cx="12" cy="5" r="3"></circle><circle cx="6" cy="16" r="3"></circle><circle cx="18" cy="16" r="3"></circle><line x1="10.5" y1="7.5" x2="7.5" y2="13.5"></line><line x1="13.5" y1="7.5" x2="16.5" y2="13.5"></line>`
        },
        "Heap": {
            color: "orange",
            desc: "Priority queues and Top-K patterns.",
            svg: `<path d="M12 3l-4 7h8z"></path><path d="M8 12l-4 7h8z"></path><path d="M16 12l-4 7h8z"></path>`
        },
        "Graph": {
            color: "violet",
            desc: "Node networks and shortest paths.",
            svg: `<circle cx="5" cy="5" r="3"></circle><circle cx="19" cy="5" r="3"></circle><circle cx="12" cy="19" r="3"></circle><line x1="7.5" y1="5" x2="16.5" y2="5"></line><line x1="6.5" y1="7.5" x2="10.5" y2="16.5"></line><line x1="17.5" y1="7.5" x2="13.5" y2="16.5"></line>`
        },
        "Dynamic Programming": {
            color: "fuchsia",
            desc: "Memoization and subproblem optimization.",
            svg: `<rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="8" y="13" width="8" height="8" rx="1"></rect><polyline points="7 11 7 17 8 17"></polyline><polyline points="17 11 17 17 16 17"></polyline>`
        }
    };

    const COURSES = { "blind-75": ["Array", "String", "Linked List", "Binary", "Matrix", "Interval", "Tree", "Heap", "Graph", "Dynamic Programming"] };

    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = './'; return; }
        const avatar = document.getElementById('user-avatar');
        if (avatar && session.user.user_metadata.avatar_url) avatar.src = session.user.user_metadata.avatar_url;
        renderTracks();
    }

    function renderTracks() {
        const urlParams = new URLSearchParams(window.location.search);
        const courseKey = urlParams.get('course') || 'blind-75';
        const tracks = COURSES[courseKey] || [];
        
        document.getElementById('course-title').textContent = `${courseKey.toUpperCase().replace('-', ' ')} Curriculum`;
        
        const grid = document.getElementById('tracks-grid');
        grid.innerHTML = tracks.map(track => {
            const meta = TRACK_METADATA[track] || { color: "slate", desc: "Algorithmic practice set.", svg: `<circle cx="12" cy="12" r="10"></circle>` };
            
            return `
                <a href="./category?course=${courseKey}&type=${encodeURIComponent(track)}" class="group block bg-white dark:bg-[#111111] border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 hover:border-zinc-400 dark:hover:border-zinc-700 hover:-translate-y-0.5 transition-all duration-200 relative overflow-hidden shadow-sm">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-11 h-11 rounded-full bg-zinc-100 dark:bg-[#161616] border border-zinc-200/80 dark:border-zinc-800 flex items-center justify-center text-zinc-900 dark:text-zinc-100 group-hover:scale-105 transition-transform duration-200">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                ${meta.svg}
                            </svg>
                        </div>
                        <h3 class="text-lg font-bold text-zinc-900 dark:text-zinc-100 group-hover:text-zinc-600 dark:group-hover:text-white transition-colors">${track}</h3>
                    </div>
                    
                    <p class="text-zinc-500 dark:text-zinc-400 text-sm leading-relaxed mb-6 h-10">
                        ${meta.desc}
                    </p>
                    
                    <div class="flex items-center justify-between mt-auto border-t border-zinc-100 dark:border-zinc-800/80 pt-4">
                        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 group-hover:text-zinc-900 dark:group-hover:text-zinc-200 transition-colors">Enter Track</span>
                        <svg class="w-4 h-4 text-zinc-400 dark:text-zinc-500 group-hover:text-zinc-900 dark:group-hover:text-zinc-200 group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            `;
        }).join('');
    }

    document.getElementById('btn-logout').onclick = async () => {
        await supabaseClient.auth.signOut();
        window.location.href = './';
    };

    checkAuth();
  </script>
</body>
</html>
