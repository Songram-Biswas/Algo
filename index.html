    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    .mono { font-family: 'Geist Mono', 'JetBrains Mono', monospace; }

    .theme-orb { width: 20px; height: 20px; border-radius: 50%; position: relative; transition: all .3s; flex-shrink: 0; }
    .theme-orb.sun { background: radial-gradient(circle at 35% 30%, #ffe9b0, #f5a623 70%); box-shadow: 0 0 12px 2px rgba(245,166,35,0.55); }
    .theme-orb.moon { background: radial-gradient(circle at 65% 35%, #d8def8, #e4e4e7 75%); box-shadow: 0 0 10px 1px rgba(228,228,231,0.3); }
    .theme-orb.moon::before { content:''; position:absolute; top:3px; left:2px; width:7px; height:7px; border-radius:50%; background:#141414; opacity:.5; }
    .theme-orb.moon::after { content:''; position:absolute; top:10px; left:10px; width:4px; height:4px; border-radius:50%; background:#141414; opacity:.4; }

    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    html.dark .glass-panel {
      background: rgba(17, 17, 17, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>

<body class="bg-zinc-50 text-zinc-900 dark:bg-[#0a0a0a] dark:text-zinc-100 min-h-screen selection:bg-zinc-500/20 overflow-x-hidden flex flex-col relative transition-colors duration-200">

  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] bg-gradient-to-b from-zinc-200/50 via-zinc-300/20 to-transparent dark:from-zinc-800/30 dark:via-zinc-900/20 dark:to-transparent rounded-full filter blur-[100px]"></div>

  </div>

  <header class="relative z-50 w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
    <div class="flex items-center gap-3 hover:opacity-80 transition cursor-pointer group">

      <span class="text-xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">algoHub</span>
    </div>
    <div class="flex items-center gap-4">
      <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-400 hover:text-zinc-900 dark:hover:text-white bg-zinc-100/60 dark:bg-[#161616] hover:bg-zinc-200/60 dark:hover:bg-zinc-800 border border-zinc-200/80 dark:border-zinc-800 transition-all duration-200 cursor-pointer shadow-sm" title="Toggle theme"><span id="theme-orb" class="theme-orb sun"></span></button>
      <button id="btn-login-nav" class="bg-zinc-900 text-white dark:bg-white dark:text-zinc-950 px-5 py-2 rounded-full font-semibold text-xs hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all duration-200 hover:-translate-y-0.5 cursor-pointer shadow-sm flex items-center gap-2 group">
        Sign In
        <svg class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
    </div>
  </header>

  <main class="relative z-10 w-full max-w-4xl mx-auto px-6 pt-20 pb-24 flex flex-col items-center text-center flex-grow">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-zinc-200 dark:border-zinc-800 bg-white/60 dark:bg-zinc-900/60 backdrop-blur-md text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-8 shadow-sm">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
      Algorithmic Sandbox
    </div>
    
    <h1 class="text-5xl sm:text-7xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100 leading-[1.08] mb-6">
      Master the <span class="text-transparent bg-clip-text bg-gradient-to-b from-zinc-900 via-zinc-700 to-zinc-500 dark:from-white dark:via-zinc-200 dark:to-zinc-400">Logic.</span><br>
      Visualize the Code.
    </h1>
    
    <p class="text-zinc-600 dark:text-zinc-400 text-base sm:text-lg max-w-2xl leading-relaxed mb-10">
      A purely interactive execution environment for data structures. Step through matrix evaluations, graph traversals, and dynamic pointer shifts in real-time.
    </p>

    <button id="btn-login-hero" class="bg-zinc-900 text-white dark:bg-white dark:text-zinc-950 font-semibold px-8 py-3.5 rounded-full hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all duration-200 hover:-translate-y-0.5 shadow-lg flex items-center gap-2.5 cursor-pointer text-sm sm:text-base">
      Launch Engine
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    </button>
  </main>

  <footer class="relative z-10 w-full border-t border-zinc-200 dark:border-zinc-800/80 bg-white/40 dark:bg-[#0a0a0a]/60 backdrop-blur-md transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <span class="text-xs font-mono text-zinc-500 dark:text-zinc-400 font-medium">© 2026 algoHub Engine. Developed by Songram Biswas.</span>
      <div class="flex items-center gap-5">
        <a href="https://www.linkedin.com/in/songram-biswas-b156a8380" target="_blank" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
        </a>
        <a href="https://twitter.com/songram_biswas" target="_blank" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.005 4.15H5.059z"/></svg>
        </a>
        <a href="https://www.facebook.com/songram.biswas.967" target="_blank" class="text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { SUPABASE_CONFIG } from './config.js';
    const supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);
    
        const themeToggleBtn = document.getElementById('theme-toggle');
    const orb = document.getElementById('theme-orb');

    function updateParticlesColor() {
        const isDark = document.documentElement.classList.contains('dark');
        return isDark ? 'rgba(255, 255, 255, 0.25)' : 'rgba(24, 24, 27, 0.2)';
    }

    let particleColor = updateParticlesColor();

    function applyTheme(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        orb.classList.toggle('sun', !isDark);
        orb.classList.toggle('moon', isDark);
        particleColor = isDark ? 'rgba(255, 255, 255, 0.25)' : 'rgba(24, 24, 27, 0.2)';
    }
    const storedTheme = localStorage.getItem('color-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(storedTheme === 'dark' || (!storedTheme && prefersDark));

    themeToggleBtn.addEventListener('click', function() {
        const goingDark = !document.documentElement.classList.contains('dark');
        applyTheme(goingDark);
        localStorage.setItem('color-theme', goingDark ? 'dark' : 'light');
    });

    async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            window.location.href = './dashboard';
        }
    }

    function triggerGoogleLogin() {
        const redirectTo = `${window.location.origin}/dashboard`;
        supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo }
        });
    }

    document.getElementById('btn-login-nav').onclick = triggerGoogleLogin;
    document.getElementById('btn-login-hero').onclick = triggerGoogleLogin;
    
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function initParticles() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 120; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 2.5,
                vy: (Math.random() - 0.5) * 2.5,
                radius: Math.random() * 2.5 + 0.5
            });
        }
    }

    function animateParticles() {
        requestAnimationFrame(animateParticles);
        ctx.clearRect(0, 0, width, height);
        
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = particleColor;
            ctx.fill();
        });

        ctx.lineWidth = 0.8;
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 150) {
                    ctx.beginPath();
                    const opacity = 0.3 - dist/500;
                    ctx.strokeStyle = particleColor.replace(/[\d.]+\)$/g, opacity + ')');
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
    }

    window.addEventListener('resize', initParticles);
    initParticles();
    animateParticles();
    init();
  </script>
</body>
</html>
