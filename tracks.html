      content:'';

      left:2px; 
      width:7px; 
      height:7px; 
      border-radius:50%; 
      background:#141414; 
      opacity:.5;

    .theme-orb.moon::after { 
      content:'';

  <script type="module">
    import { SUPABASE_CONFIG } from './config.js';
    const supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key);

    const themeToggleBtn = document.getElementById('theme-toggle');
    const orb = document.getElementById('theme-orb');
    function applyTheme(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        orb.classList.toggle('sun', !isDark);
        orb.classList.toggle('moon', isDark);
    }
    const storedTheme = localStorage.getItem('color-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(storedTheme === 'dark' || (!storedTheme && prefersDark));

    themeToggleBtn.addEventListener('click', function() {
        const goingDark = !document.documentElement.classList.contains('dark');
        applyTheme(goingDark);
        localStorage.setItem('color-theme', goingDark ? 'dark' : 'light');
        });

            svg: `<circle cx="12" cy="5" r="3"></circle><circle cx="6" cy="17" r="3"></circle><circle cx="18" cy="17" r="3"></circle><line x1="10.5" y1="7.5" x2="7.5" y2="14.5"></line><line x1="13.5" y1="7.5" x2="16.5" y2="14.5"></line>`,
            iconColor: "text-emerald-500 dark:text-emerald-400",
            hoverBorder: "hover:border-emerald-500/50 hover:bg-emerald-500/5 dark:hover:border-emerald-500/40 dark:hover:bg-emerald-950/20",
            hoverText: "group-hover:text-emerald-600 dark:group-hover:text-emerald-400"
        },
        "Heap": {
            color: "orange",
            desc: "Priority queues and Top-K patterns.",
            svg: `<path d="M12 3l-4 7h8z"></path><path d="M8 12l-4 7h8z"></path><path d="M16 12l-4 7h8z"></path>`,
            iconColor: "text-orange-500 dark:text-orange-400",
            hoverBorder: "hover:border-orange-500/50 hover:bg-orange-500/5 dark:hover:border-orange-500/40 dark:hover:bg-orange-950/20",
            hoverText: "group-hover:text-orange-600 dark:group-hover:text-orange-400"
        },
        "Graph": {
            color: "violet",
            desc: "Node networks and shortest paths.",
            svg: `<circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="6" r="3"></circle><circle cx="12" cy="18" r="3"></circle><line x1="8.5" y1="7" x2="15.5" y2="7"></line><line x1="7.5" y1="8.5" x2="10.5" y2="15.5"></line><line x1="16.5" y1="8.5" x2="13.5" y2="15.5"></line>`,
            iconColor: "text-violet-500 dark:text-violet-400",
            hoverBorder: "hover:border-violet-500/50 hover:bg-violet-500/5 dark:hover:border-violet-500/40 dark:hover:bg-violet-950/20",
            hoverText: "group-hover:text-violet-600 dark:group-hover:text-violet-400"
        },
        "Dynamic Programming": {
            color: "fuchsia",
            desc: "Memoization and subproblem optimization.",
            svg: `<rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="8.5" y="14" width="7" height="7" rx="1"></rect><polyline points="7 10 7 14 8.5 14"></polyline><polyline points="17 10 17 14 15.5 14"></polyline>`,
            iconColor: "text-fuchsia-500 dark:text-fuchsia-400",
            hoverBorder: "hover:border-fuchsia-500/50 hover:bg-fuchsia-500/5 dark:hover:border-fuchsia-500/40 dark:hover:bg-fuchsia-950/20",
            hoverText: "group-hover:text-fuchsia-600 dark:group-hover:text-fuchsia-400"
        },
        "Arrays & Hashing": {
            color: "blue",
            desc: "Hash maps, sets, frequency counting, and prefix sums.",
            svg: `<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line>`,
            iconColor: "text-blue-500 dark:text-blue-400",
            hoverBorder: "hover:border-blue-500/50 hover:bg-blue-500/5 dark:hover:border-blue-500/40 dark:hover:bg-blue-950/20",
            hoverText: "group-hover:text-blue-600 dark:group-hover:text-blue-400"
        },
        "Two Pointers": {
            color: "cyan",
            desc: "Converging pointers and fast-slow boundary traversal.",
            svg: `<path d="M7 16l-4-4m0 0l4-4m-4 4h18M17 8l4 4m0 0l-4 4m4-4H3"></path>`,
            iconColor: "text-cyan-500 dark:text-cyan-400",
            hoverBorder: "hover:border-cyan-500/50 hover:bg-cyan-500/5 dark:hover:border-cyan-500/40 dark:hover:bg-cyan-950/20",
            hoverText: "group-hover:text-cyan-600 dark:group-hover:text-cyan-400"
        },
        "Sliding Window": {
            color: "sky",
            desc: "Dynamic subarrays, expansion/shrink, and state tracking.",
            svg: `<rect x="4" y="4" width="16" height="16" rx="2"></rect><line x1="10" y1="4" x2="10" y2="20"></line><line x1="4" y1="12" x2="20" y2="12"></line>`,
            iconColor: "text-sky-500 dark:text-sky-400",
            hoverBorder: "hover:border-sky-500/50 hover:bg-sky-500/5 dark:hover:border-sky-500/40 dark:hover:bg-sky-950/20",
            hoverText: "group-hover:text-sky-600 dark:group-hover:text-sky-400"
        },
        "Stack": {
            color: "amber",
            desc: "LIFO ordering, monotonic stacks, and parentheses parsing.",
            svg: `<polyline points="4 8 12 4 20 8"></polyline><polyline points="4 12 12 8 20 12"></polyline><polyline points="4 16 12 12 20 16"></polyline>`,
            iconColor: "text-amber-500 dark:text-amber-400",
            hoverBorder: "hover:border-amber-500/50 hover:bg-amber-500/5 dark:hover:border-amber-500/40 dark:hover:bg-amber-950/20",
            hoverText: "group-hover:text-amber-600 dark:group-hover:text-amber-400"
        },
        "Binary Search": {
            color: "emerald",
            desc: "Logarithmic interval reduction and condition predicates.",
            svg: `<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line>`,
            iconColor: "text-emerald-500 dark:text-emerald-400",
            hoverBorder: "hover:border-emerald-500/50 hover:bg-emerald-500/5 dark:hover:border-emerald-500/40 dark:hover:bg-emerald-950/20",
            hoverText: "group-hover:text-emerald-600 dark:group-hover:text-emerald-400"
        }
    };

    const COURSES = {
        "blind-75": ["Array", "String", "Linked List", "Binary", "Matrix", "Interval", "Tree", "Heap", "Graph", "Dynamic Programming"],
        "neetcode-150": ["Arrays & Hashing", "Two Pointers", "Sliding Window", "Stack", "Binary Search", "Linked List", "Tree", "Heap", "Graph", "Dynamic Programming"]
    };

    const TRACK_PROBLEM_COUNTS = {
        "Array": 10,
        "String": 8,
        "Linked List": 6,
        "Binary": 5,
        "Matrix": 5,
        "Interval": 5,
        "Tree": 15,
        "Heap": 3,
        "Graph": 8,
        "Dynamic Programming": 10,
        "Arrays & Hashing": 9,
        "Two Pointers": 5,
        "Sliding Window": 6,
        "Stack": 7,
        "Binary Search": 7
    };

    let currentCourse = 'blind-75';

    function switchCourse(courseKey) {
        currentCourse = courseKey;
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('course', courseKey);
        window.history.pushState({}, '', newUrl);

        updateTabUI();
        renderTracks();
    }

    function updateTabUI() {
        const tabBlind = document.getElementById('tab-blind-75');
        const tabNeet = document.getElementById('tab-neetcode-150');
        if (!tabBlind || !tabNeet) return;

        const activeClass = "bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 shadow-sm";
        const inactiveClass = "text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white";

        if (currentCourse === 'neetcode-150') {
            tabNeet.className = `course-tab px-5 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 cursor-pointer ${activeClass}`;
            tabBlind.className = `course-tab px-5 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 cursor-pointer ${inactiveClass}`;
        } else {
            tabBlind.className = `course-tab px-5 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 cursor-pointer ${activeClass}`;
            tabNeet.className = `course-tab px-5 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 cursor-pointer ${inactiveClass}`;
        }
    }

    function getCategoryXp(track) {
        // 1. Direct local storage key xp_Array, etc.
        const directKey = 'xp_' + track;
        const directVal = Number(localStorage.getItem(directKey));
        if (!isNaN(directVal) && directVal > 0) return directVal;

        // 2. Consolidated map
        try {
            const catMap = JSON.parse(localStorage.getItem('algohub_category_xp') || '{}');
            if (catMap[track] && !isNaN(Number(catMap[track]))) return Number(catMap[track]);
        } catch (e) {}

        // 3. From cached solved list if available
        try {
            const cachedSolved = JSON.parse(localStorage.getItem('algohub_solved_cache') || '[]');
            if (Array.isArray(cachedSolved) && cachedSolved.length > 0) {
                const matchCount = cachedSolved.filter(s => {
                    const slug = s.problem_slug || '';
                    if (track === 'Two Pointers') return ['valid-palindrome', 'two-sum-ii-input-array-is-sorted', '3sum', 'container-with-most-water', 'trapping-rain-water'].includes(slug);
                    if (track === 'Sliding Window') return ['best-time-to-buy-and-sell-stock', 'longest-substring-without-repeating-characters', 'longest-repeating-character-replacement', 'permutation-in-string', 'minimum-window-substring', 'sliding-window-maximum'].includes(slug);
                    if (track === 'Stack') return ['valid-parentheses', 'min-stack', 'evaluate-reverse-polish-notation', 'daily-temperatures', 'largest-rectangle-in-histogram'].includes(slug);
                    if (track === 'Binary Search') return ['binary-search', 'search-a-2d-matrix', 'koko-eating-bananas', 'find-minimum-in-rotated-sorted-array', 'search-in-rotated-sorted-array', 'median-of-two-sorted-arrays'].includes(slug);
                    if (track === 'Arrays & Hashing' || track === 'Array') return ['two-sum', 'contains-duplicate', 'valid-anagram', 'group-anagrams', 'top-k-frequent-elements', 'product-of-array-except-self', 'valid-sudoku', 'longest-consecutive-sequence'].includes(slug);
                    return false;
                }).length;
                const computed = matchCount * 20;
                if (computed > 0) {
                    localStorage.setItem(directKey, String(computed));
                    return computed;
                }
            }
        } catch (e) {}

        return 0;
    }

    async function checkAuth() {
        const urlParams = new URLSearchParams(window.location.search);
        const courseParam = urlParams.get('course');
        if (courseParam === 'neetcode-150' || courseParam === 'blind-75') {
            currentCourse = courseParam;
        }

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = './'; return; }
        const avatar = document.getElementById('user-avatar');
        if (avatar && session.user.user_metadata.avatar_url) avatar.src = session.user.user_metadata.avatar_url;

        // Pre-fetch solved problems to ensure category XP cache is warm
        try {
            const { data: progress } = await supabaseClient
                .from('user_progress')
                .select('problem_slug, status')
                .eq('user_id', session.user.id)
                .eq('status', 'solved');
            if (progress && progress.length > 0) {
                localStorage.setItem('algohub_solved_cache', JSON.stringify(progress));
            }
        } catch (e) {}

        renderTracks();
    }

    function renderTracks() {
        const urlParams = new URLSearchParams(window.location.search);
        const courseKey = urlParams.get('course') || currentCourse || 'blind-75';
        currentCourse = courseKey;
        updateTabUI();

        const tracks = COURSES[courseKey] || COURSES['blind-75'];
        const courseDisplayName = courseKey === 'neetcode-150' ? 'NeetCode 150' : 'Blind 75';
        
        document.getElementById('course-title').textContent = `${courseDisplayName} Curriculum`;
        
        const grid = document.getElementById('tracks-grid');
        grid.innerHTML = tracks.map(track => {
            const meta = TRACK_METADATA[track] || {
                color: "blue",
                desc: "Algorithmic practice set.",
                svg: `<circle cx="12" cy="12" r="10"></circle>`,
                iconColor: "text-blue-500 dark:text-blue-400",
                hoverBorder: "hover:border-blue-500/50 hover:bg-blue-500/5 dark:hover:border-blue-500/40 dark:hover:bg-blue-950/20",
                hoverText: "group-hover:text-blue-600 dark:group-hover:text-blue-400"
            };
            const catXp = getCategoryXp(track);
            const probCount = TRACK_PROBLEM_COUNTS[track] || 10;
            
            return `
                <a href="./category?course=${encodeURIComponent(currentCourse)}&type=${encodeURIComponent(track)}"
                   data-color="${meta.color}"
                   class="track-card group block bg-white dark:bg-[#111111] border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 relative overflow-hidden shadow-sm ${meta.hoverBorder}">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div class="flex items-center gap-3.5">
                            <div class="track-icon-wrap w-11 h-11 rounded-xl bg-zinc-100 dark:bg-[#161616] border border-zinc-200/80 dark:border-zinc-800 flex items-center justify-center ${meta.iconColor} group-hover:scale-105 transition-all duration-200">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    ${meta.svg}
                                </svg>
                            </div>
                            <div>
                                <h3 class="track-title text-lg font-bold text-zinc-900 dark:text-zinc-100 ${meta.hoverText} transition-colors duration-200">${track}</h3>
                                <span class="text-xs font-mono text-zinc-400 dark:text-zinc-500">${probCount} Problems</span>
                            </div>
                        </div>
                        <div class="px-2.5 py-1 rounded-full text-xs font-bold font-mono tracking-tight bg-zinc-100 dark:bg-[#161616] text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-800 shadow-sm flex items-center gap-1 group-hover:border-zinc-400 dark:group-hover:border-zinc-700 transition-colors" title="${track} Experience Points">
                            <span class="text-amber-500 text-[11px]">⚡</span>
                            <span class="category-xp-val">${catXp} XP</span>
                        </div>
                    </div>
                    
                    <p class="text-zinc-500 dark:text-zinc-400 text-sm leading-relaxed mb-6 h-10">
                        ${meta.desc}
                    </p>
                    
                    <div class="flex items-center justify-between mt-auto border-t border-zinc-100 dark:border-zinc-800/80 pt-4">
                        <span class="track-action text-xs font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 ${meta.hoverText} transition-colors duration-200">Enter Track</span>
                        <svg class="track-arrow w-4 h-4 text-zinc-400 dark:text-zinc-500 ${meta.hoverText} group-hover:translate-x-1 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            `;
        }).join('');
    }

    // Attach Tab Handlers
    document.getElementById('tab-blind-75')?.addEventListener('click', () => switchCourse('blind-75'));
    document.getElementById('tab-neetcode-150')?.addEventListener('click', () => switchCourse('neetcode-150'));

    document.getElementById('btn-logout').onclick = async () => {
        await supabaseClient.auth.signOut();
        window.location.href = './';
    };

    checkAuth();
  </script>
</body>
</html>
