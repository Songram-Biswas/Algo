        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = './';
                return;
            }
            const avatar = document.getElementById('user-avatar');
            if (avatar && session.user.user_metadata.avatar_url) {
                avatar.src = session.user.user_metadata.avatar_url;
            }
            currentUserId = session.user.id;
            await loadSolvedSet();
            renderCategory();
        }

        async function loadSolvedSet() {
            const { data, error } = await supabaseClient
                .from('user_progress')
                .select('problem_slug')
                .eq('user_id', currentUserId)
                .eq('status', 'solved');

            if (error || !data) {
                solvedSet = new Set();
                return;
            }
            solvedSet = new Set(data.map(d => d.problem_slug));
        }

            const course = params.get('course') || 'blind-75';
            const cat = params.get('type') || 'Array';
            const query = document.getElementById('search-box').value.toLowerCase();

            document.getElementById('back-link').href = `./tracks?course=${course}`;
            document.getElementById('category-title').textContent = `${cat}`;

            const container = document.getElementById('problem-list');
            container.innerHTML = '';

            const solvedArray = Array.from(solvedSet);
            const categoryProbs = PROBLEM_REGISTRY.filter(p => p.category === cat);
            const solvedInCat = categoryProbs.filter(p => solvedArray.includes(p.slug)).length;
            const percent = Math.round((solvedInCat / categoryProbs.length) * 100);
            document.getElementById('category-progress').textContent = `${percent}%`;

            PROBLEM_REGISTRY.forEach(prob => {
                if (prob.category === cat) {
                    if (query && !prob.title.toLowerCase().includes(query) && !prob.id.toString().includes(query)) {
                        return;
                    }

                    const isSolved = solvedArray.includes(prob.slug);

                    let targetUrl = `./solution?slug=${prob.slug}`;
                    if (prob.implemented) {
                        targetUrl = `./solutions/${prob.slug}`;
                    }

                    const tr = document.createElement('tr');
                    tr.className = "problem-row hover:bg-zinc-50 dark:hover:bg-[#161616] transition-colors border-b border-zinc-100 dark:border-zinc-800/60 last:border-0";

                    let diffClass = 'text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
                    if (prob.difficulty === 'Medium') diffClass = 'text-amber-600 dark:text-amber-400 bg-amber-500/10 border-amber-500/20';
                    if (prob.difficulty === 'Hard') diffClass = 'text-rose-600 dark:text-rose-400 bg-rose-500/10 border-rose-500/20';

                    const statusIcon = isSolved
                        ? `<svg class="w-4 h-4 text-emerald-500 mx-auto" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>`
                        : `<div class="w-3.5 h-3.5 rounded-full border-2 border-zinc-300 dark:border-zinc-700 mx-auto group-hover:border-zinc-400 transition-colors"></div>`;

                    tr.innerHTML = `
                        <td class="px-6 py-3.5 whitespace-nowrap align-middle">
                            ${statusIcon}
                        </td>
                        <td class="px-6 py-3.5 align-middle">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-mono text-zinc-400 dark:text-zinc-500 w-6 text-right">${prob.id}.</span>
                                <a href="${targetUrl}" class="text-sm font-semibold text-zinc-900 dark:text-zinc-100 hover:text-zinc-600 dark:hover:text-white transition-colors">${prob.title}</a>
                            </div>
                        </td>
                        <td class="px-6 py-3.5 whitespace-nowrap align-middle">
                            <span class="text-[11px] font-semibold uppercase tracking-wider px-3 py-0.5 rounded-full border ${diffClass}">${prob.difficulty}</span>
                        </td>
                        <td class="px-6 py-3.5 whitespace-nowrap text-right align-middle">
                            <a href="${targetUrl}" class="inline-flex items-center justify-center bg-white dark:bg-[#161616] border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-[#202020] text-zinc-700 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white text-xs font-semibold px-3.5 py-1.5 rounded-full transition-all duration-200 hover:-translate-y-0.5 shadow-sm">
                                Solve
                            </a>
                        </td>
                    `;
                    container.appendChild(tr);
                }
            });

            if (container.innerHTML === '') {
                container.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500 dark:text-slate-400 text-sm">No problems found matching your criteria.</td></tr>`;
            }
        }

        document.getElementById('search-box').addEventListener('input', renderCategory);
        document.getElementById('btn-logout').onclick = async () => { await supabaseClient.auth.signOut(); window.location.href = './'; };

        checkAuth();
    </script>
</body>

</html>
